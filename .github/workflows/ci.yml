name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Run checks
        run: make check
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - name: Check generated schemas are up to date
        run: uv run python scripts/export_schemas.py --check
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - name: Check the check catalog is up to date
        run: make docs-check
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  selfval-fast:
    name: Self-validation, fast subset (no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Scan the reference server with a dozen injected bugs
        run: make selfval-fast
        env:
          UV_PYTHON: 3.13
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfval-fast
          path: selfval-out/selfval

  smoke-test:
    name: Smoke Test (macOS, Python 3.13)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Run checks
        run: make check
        env:
          UV_PYTHON: 3.13
