name: Self-validation (nightly)

# Scans the reference server in the Docker sandbox, clean and with every injected bug, three seeds,
# deep mode. The job fails if a bug goes undetected, the clean server fails a check, or any
# check fails that expected.yaml does not allow.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  selfval:
    name: probe selfval (sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Build the images the sandbox runs
        run: |
          docker build -t probe-refserver:dev reference/refserver
          docker build -t probe-fixtures:dev fixtures_runtime
      - name: Run every bug on seeds 1, 2 and 3
        run: uv run probe selfval --bugs all --seeds 1,2,3 --workers 4 --out selfval-out
        env:
          UV_PYTHON: 3.13
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfval
          path: selfval-out/selfval

  # Not part of the accuracy gate: the official suite against the clean reference server over
  # HTTP, so its results can be read and triaged.
  conformance:
    name: official conformance on the clean reference server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Build the images
        run: |
          docker build -t probe-refserver:dev reference/refserver
          docker build -t probe-fixtures:dev fixtures_runtime
          docker build -t probe-conformance:dev images/conformance
      - name: Scan over HTTP, only the delegated suite
        run: >
          uv run probe run --image probe-refserver:dev --profile profiles/refserver-conformance.yaml
          --conformance-image probe-conformance:dev
          --mode standard --only 'protocol.official.*' --fail-on none --out conformance-out
        env:
          UV_PYTHON: 3.13
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance
          path: conformance-out/
