[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probe"]

[project]
name = "probe-mcp"
version = "0.1.0.dev0"
description = "A behavioral, safety, and operability test suite for MCP servers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "marsh15" }]
keywords = ["mcp", "testing", "security", "safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]

dependencies = [
  "typer",
  "rich",
  "pydantic>=2.9",
  "pyyaml",
  "httpx>=0.28",
  "anyio",
  "jsonschema>=4.26",
  "referencing",
  "hypothesis>=6.170",
  "hypothesis-jsonschema>=0.23.2",
  "docker>=7.2",
  "jinja2",
  "markupsafe",
]

[project.optional-dependencies]
llm = ["anthropic"]

[project.scripts]
probe = "probe.cli.app:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-timeout",
  "syrupy",
  "mypy",
  "ruff",
  "types-PyYAML",
  "mcp>=2.3,<3",
  "uvicorn",
  "playwright",
  "axe-playwright-python",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"reference/**" = ["S"]
"fixtures_runtime/**" = ["S104"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "docker: marks tests that require Docker",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
timeout = 120
